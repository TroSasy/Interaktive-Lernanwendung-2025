<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Floorplan</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background-color: #fff;
        color: black;

        line-height: 1.6;
      }

      h2 {
        color: #b22222;
        font-size: 2rem;
      }

      .container {
        display: flex;
        flex-wrap: wrap; /* für mobile Ansicht */
        gap: 40px;
        align-items: flex-start;
      }

      .text {
        flex: 1 1 50%;
        min-width: 300px;
      }

    .image {
      flex: 1 1 100%;
      min-width: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

      .image img {
        max-width: 100%;
        height: auto;
        display: block;
      }

    </style>
  </head>
  <body>
    <h2>Floorplan:</h2>

 
      <div class="image">
        <img
          src="/003_webseite_html_in_html/003_webseite_html_in_html/clab/floorplan_OG.png"
          alt="Aufbau eines Feuerlöschers"
        />
      </div>
    </div>
  </body>
</html>
