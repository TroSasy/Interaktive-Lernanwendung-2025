<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no" />
  <title>Sicherheitsunterweisung Windows-Pool</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.7.0/aframe.min.js"></script>
  <link rel="stylesheet" href="../style_test.css" />

  <style>
    /* ---------- Overlay‑Layout ---------- */
    #overlay-backdrop{
      display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999;
    }
    #info-window{
      position:fixed;top:10%;left:50%;transform:translateX(-50%);
      width:80%;height:70%;background:#fff;border:2px solid #888;border-radius:10px;
      box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:1000;display:none;
      flex-direction:column;overflow:hidden;
    }
    #info-frame{width:100%;height:90%;border:none;}
    #overlay-controls{display:flex;justify-content:center;gap:16px;padding:8px;}
    #overlay-controls button{padding:8px 16px;font-size:1rem;cursor:pointer;}
  </style>
</head>

<body>
  <a id="back-button" href="/003_webseite_html_in_html/003_webseite_html_in_html/index.html">⟵ Zurück</a>

  <!--‑‑ A‑Frame Szene ‑‑-->
  <a-scene>
    <a-sky src="/003_webseite_html_in_html/003_webseite_html_in_html/windows-pool/W1-Windows-Pool.jpg"
           rotation="0 -40 0"></a-sky>

    <!-- POIs (Positions & IDs bleiben unverändert) -->
    <a-entity position="7 0.2 -1.3" poi-overlay data-id="feuerloescher"></a-entity>
    <a-entity position="7 1 -1.55"   poi-overlay data-id="notausschalter"></a-entity>
    <a-entity position="8 -7 4"  poi-overlay data-id="notausschalter_tisch"></a-entity>
    <a-entity position="8 1.25 -6.7" poi-overlay data-id="raumsteuerung"></a-entity>
    <a-entity position="-5 0.5 -8"  poi-overlay data-id="pult"></a-entity>

    <a-camera look-controls="enabled:false"
              drag-rotate
              cursor="rayOrigin:mouse;raycaster:objects:[open-window],[link-to-page]"></a-camera>
  </a-scene>

  <!--‑‑ Overlay ‑‑-->
  <div id="overlay-backdrop"></div>

  <div id="info-window">
    <iframe id="info-frame"></iframe>
    <div id="overlay-controls">
      <button id="prev-slide">Zurück</button>
      <button id="next-slide">Weiter</button>
      <button onclick="closeOverlay()">Schließen</button>
    </div>
  </div>

  <script>
    /* ---------- Kamerasteuerung ---------- */
    AFRAME.registerComponent("drag-rotate",{init(){
      const cam=this.el.object3D;let drag=false;
      document.addEventListener("mousedown",()=>drag=true);
      document.addEventListener("mouseup",()=>drag=false);
      document.addEventListener("mousemove",e=>{
        if(!drag) return;
        cam.rotation.y+=(e.movementX||0)*.002;
        cam.rotation.x=Math.max(-Math.PI/2,Math.min(Math.PI/2,
                          cam.rotation.x+(e.movementY||0)*.002));
      });
    }});

    /* ---------- POI‑Overlay (Punkt & Puls) ---------- */
    AFRAME.registerComponent("poi-overlay",{init(){
      const wrap=this.el,id=wrap.getAttribute("data-id");
      const pulse=document.createElement("a-sphere");
      pulse.setAttribute("radius",".2");
      pulse.setAttribute("material","color:white;shader:flat;opacity:.5");
      pulse.setAttribute("animation","property:scale;to:.12 .12 .12;dur:1500;loop:true;dir:alternate");
      wrap.appendChild(pulse);

      const fixed=document.createElement("a-sphere");
      fixed.setAttribute("radius",".15");
      fixed.setAttribute("material","color:red;shader:flat;opacity:.8");
      fixed.setAttribute("open-window","");
      fixed.setAttribute("data-id",id);           /* ID ans klickbare Element */
      wrap.appendChild(fixed);
    }});

    /* ---------- Links pro POI (Arrays, wie in Mac‑Version) ---------- */
    const poiData={
      feuerloescher: {
        links: [
          "windows_feuerloescher_info1.html",
          "windows_feuerloescher_info2.html",
          "windows_feuerloescher_info3.html",
          "windows_feuerloescher.html"
        ]
      },
      notausschalter    :{links:["windows_notausschalter.html"]},
      notausschalter_tisch:{links:["windows_notausschalter_tisch.html"]},
      raumsteuerung     :{links:["windows_raumsteuerung.html"]},
      pult              :{links:["windows_medientechnik.html"]}
    };

    let curSlide=0,curLinks=[];

    /* ---------- Overlay‑Öffnen ---------- */
    AFRAME.registerComponent("open-window",{init(){
      this.el.addEventListener("click",()=>{
        const id=this.el.getAttribute("data-id"),data=poiData[id];
        if(!data||!Array.isArray(data.links)) return;
        curLinks=data.links;curSlide=0;
        loadSlide(curSlide);
        document.getElementById("overlay-backdrop").style.display="block";
        document.getElementById("info-window").style.display="flex";
      });
    }});

    function loadSlide(i){
      const frm=document.getElementById("info-frame");
      frm.src=curLinks[i];
      document.getElementById("prev-slide").disabled=i===0;
      document.getElementById("next-slide").disabled=i===curLinks.length-1;
    }
    document.getElementById("prev-slide").onclick=()=>{if(curSlide>0)loadSlide(--curSlide);};
    document.getElementById("next-slide").onclick=()=>{if(curSlide<curLinks.length-1)loadSlide(++curSlide);};

    function closeOverlay(){
      document.getElementById("overlay-backdrop").style.display="none";
      document.getElementById("info-window").style.display="none";
      document.getElementById("info-frame").src="about:blank";
    }
    document.getElementById("overlay-backdrop").onclick=closeOverlay;

    /* ---------- Dummy‑Komponente für evtl. Seitenwechsel ---------- */
    AFRAME.registerComponent("link-to-page",{init(){
      this.el.addEventListener("click",()=>window.location.href="C-Lab-1.html");
    }});

    /* ---------- Overlay beim Start verstecken ---------- */
    window.addEventListener("DOMContentLoaded",()=>{
      document.getElementById("info-window").style.display="none";
      document.getElementById("overlay-backdrop").style.display="none";
      document.getElementById("info-frame").src="about:blank";
    });
  </script>
</body>
</html>
