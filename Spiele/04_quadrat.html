<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Jump and Run – Rainbow Runner</title>
  <style>
    body {
      margin: 0;
      background: #000;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #gameCanvas {
      background: #000;
      display: block;
      border: 2px solid #fff;
    }

    #info {
      margin-top: 10px;
      font-size: 18px;
      background: rgba(0, 0, 0, 0.9);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      text-align: center;
    }

    #instructions {
      margin-top: 5px;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="400"></canvas>

<div id="info">
  Punkte: <span id="score">0</span> |
  Sprünge: <span id="jumps">0</span>
  <div id="instructions">[Leertaste] Start & Springen | [R] Neustart</div>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreDisplay = document.getElementById('score');
  const jumpDisplay = document.getElementById('jumps');

  let gameRunning = false;

  const player = {
    x: 50,
    y: 300,
    width: 30,
    height: 30,
    dy: 0,
    gravity: 0.6,
    jumpPower: -12,
    onGround: true,
    doubleJumpAvailable: false,
    jumpCount: 0
  };

  let obstacles = [];
  let obstacleTimer = 0;
  let speed = 2;
  let score = 0;
  let jumps = 0;
  let gameOver = false;
  let animationFrame;
  let hue = 0;

  function resetGame() {
    player.y = 300;
    player.dy = 0;
    player.onGround = true;
    player.doubleJumpAvailable = false;
    player.jumpCount = 0;
    obstacles = [];
    obstacleTimer = 0;
    speed = 2;
    score = 0;
    jumps = 0;
    gameOver = false;
    scoreDisplay.textContent = score;
    jumpDisplay.textContent = jumps;
    hue = 0;
  }

  function drawPlayer() {
    ctx.save();
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#ffffff';
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(player.x, player.y, player.width, player.height);
    ctx.restore();
  }

  function drawObstacle(obstacle) {
    ctx.save();
    ctx.shadowBlur = 20;
    ctx.shadowColor = obstacle.color;
    ctx.fillStyle = obstacle.color;
    ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
    ctx.restore();
  }

  function createObstacle() {
    const height = 30 + Math.random() * 40;
    const color = `hsl(${hue}, 100%, 50%)`;
    hue = (hue + 60) % 360; // nächste Regenbogenfarbe

    obstacles.push({
      x: canvas.width,
      y: canvas.height - height,
      width: 20,
      height: height,
      passed: false,
      color: color
    });
  }

  function updatePlayer() {
    player.dy += player.gravity;
    player.y += player.dy;

    if (player.y + player.height >= canvas.height) {
      player.y = canvas.height - player.height;
      player.dy = 0;
      player.onGround = true;
      player.jumpCount = 0;
    } else {
      player.onGround = false;
    }

    if (score >= 10) {
      player.doubleJumpAvailable = true;
    }
  }

  function updateObstacles() {
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const obs = obstacles[i];
      obs.x -= speed;

      if (!obs.passed && obs.x + obs.width < player.x) {
        obs.passed = true;
        score++;
        scoreDisplay.textContent = score;
      }

      if (
              player.x < obs.x + obs.width &&
              player.x + player.width > obs.x &&
              player.y < obs.y + obs.height &&
              player.y + player.height > obs.y
      ) {
        gameOver = true;
      }

      if (obs.x + obs.width < 0) {
        obstacles.splice(i, 1);
      }
    }
  }

  function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawPlayer();
    updatePlayer();

    updateObstacles();
    for (const obs of obstacles) {
      drawObstacle(obs);
    }

    obstacleTimer++;
    if (obstacleTimer > 90 - speed * 5) {
      createObstacle();
      obstacleTimer = 0;
    }

    if (speed < 10) {
      speed += 0.001;
    }

    if (!gameOver) {
      animationFrame = requestAnimationFrame(gameLoop);
    } else {
      ctx.fillStyle = 'white';
      ctx.font = '40px Arial';
      ctx.fillText('Game Over!', canvas.width / 2 - 100, canvas.height / 2);
      gameRunning = false;
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      if (!gameRunning) {
        resetGame();
        gameRunning = true;
        gameLoop();
      } else {
        if (player.onGround) {
          player.dy = player.jumpPower;
          player.jumpCount = 1;
          jumps++;
          jumpDisplay.textContent = jumps;
        } else if (player.doubleJumpAvailable && player.jumpCount === 1) {
          player.dy = player.jumpPower;
          player.jumpCount = 2;
          jumps++;
          jumpDisplay.textContent = jumps;
        }
      }
    }

    if (e.code === 'KeyR' && !gameRunning) {
      resetGame();
      gameRunning = true;
      gameLoop();
    }
  });
</script>
</body>
</html>
